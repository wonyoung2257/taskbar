name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build universal binaries
        run: make build-universal

      - name: Assemble app bundle
        run: make app-universal

      - name: Create release archive
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          make release-zip VERSION="$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          gh release create "$TAG_NAME" ".build/tbar-${VERSION}-universal.zip" \
            --title "$TAG_NAME" \
            --notes "Release $TAG_NAME"
